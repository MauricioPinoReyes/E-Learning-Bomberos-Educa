<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2027"/>
      <stop offset="100%" style="stop-color:#2196F3"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <g transform="translate(300,130)" font-family="Arial,sans-serif" font-size="80" font-weight="bold" fill="rgba(255,255,255,0.2)"><text x="0" y="60">+</text><text x="80" y="60">−</text><text x="160" y="60">×</text><text x="240" y="60">÷</text></g>
  <rect x="0" y="430" width="800" height="20" fill="#2196F3"/>
  <rect x="0" y="0" width="8" height="450" fill="#2196F3" opacity="0.85"/>
</svg>